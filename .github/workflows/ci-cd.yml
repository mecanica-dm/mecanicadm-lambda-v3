name: CI/CD - Lambda CPF/JWT

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Executa os testes unitários
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup do Node.js (CLI do Serverless Framework)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instala o Serverless Framework
        run: npm ci

      - name: Deploy da função (stage prod)
        run: npx serverless deploy --stage prod --verbose
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
