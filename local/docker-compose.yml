services:
  db:
    image: postgres:15-alpine
    container_name: mecanicadm-lambda-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mecanicadmdb
    volumes:
      - lambda_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d mecanicadmdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lambda_postgres_data: